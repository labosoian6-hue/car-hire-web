{% extends "base.html" %}
{% block title %}Our Cars{% endblock %}
{% block content %}
  <h1>Our Cars</h1>
  <ul class="car-list">
    {% for car in cars %}
      <li>
        <a href="{{ url_for('car_detail', car_id=car.id) }}" style="display:flex; align-items:center; gap:12px; flex:1; color:inherit;">
          {% if car.image_filename %}
            <img src="{{ url_for('static', filename='uploads/' + car.image_filename) }}" style="width:70px; height:70px; object-fit:cover; border-radius:6px;">
          {% endif %}
          <span>{{ car.make }} {{ car.model }} <span class="price">${{ car.week_rate }}/week</span></span>
        </a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
