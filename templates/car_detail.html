{% extends "base.html" %}
{% block content %}
  <p><a href="{{ url_for('home') }}">&larr; Back to all cars</a></p>
  <div class="card">
    {% if car.image_filename %}
      <img src="{{ url_for('static', filename='uploads/' + car.image_filename) }}" style="width:100%; max-width:400px; border-radius:10px;">
    {% endif %}
    <h2>{{ car.make }} {{ car.model }}</h2>
    <p class="price">${{ car.week_rate }}/week</p>
    <a href="{{ url_for('book_car', car_id=car.id) }}" class="btn">Book this car</a>
  </div>
{% endblock %}
